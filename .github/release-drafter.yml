name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  # What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
- title: '🚀 Features'
  labels:
  - 'feature'
  - 'enhancement'
- title: '🐛 Bug Fixes'
  labels:
  - 'fix'
  - 'bugfix'
  - 'bug'
- title: '⚠ Breaking'
  labels:
  - 'breaking'
- title: '🧰 Maintenance'
  labels:
  - 'refactor'
  - 'maintenance'
  - 'chore'
- title: '🔧 Build'
  labels:
  - 'build'
  - 'ci'
  - 'test'
  - 'ci/cd'
  - 'Build'
- title: '📄 Documentation'
  labels:
  - 'docs'
- title: '⚙️ Other changes'
- title: '📦 Dependency Updates'
  labels:
  - 'dependencies'
  - 'dependency'
  - 'dep'
  - 'deps'
  collapse-after: 5

version-resolver:
  major:
    labels:
    - 'type: breaking'
    - 'type: major'
  minor:
    labels:
    - 'type: feature'
    - 'type: minor'
  patch:
    labels:
    - 'type: bug'
    - 'type: maintenance'
    - 'type: docs'
    - 'type: dependencies'
    - 'type: security'
  default: patch

exclude-labels:
- 'skip-changelog'
