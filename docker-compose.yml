version: "3.8"

services:
  frontend-react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5677:3000"
    depends_on:
      - backend-express
    networks:
      - pottypal-network

  backend-express:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    networks:
      - pottypal-network

networks:
  pottypal-network:
    driver: bridge
